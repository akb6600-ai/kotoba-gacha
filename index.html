<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ことばガチャ</title><style>
:root{--pink:#ff5d9e}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff7fb,#f8fbff 55%,#fffdf3);color:#222}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.logo{text-align:center;font-weight:900;font-size:clamp(34px,10vw,60px);margin:6px 0}.logo span:nth-child(1){color:#ff5d9e}.logo span:nth-child(2){color:#ff9f43}.logo span:nth-child(3){color:#ffd84d}.logo span:nth-child(4){color:#62d59d}.logo span:nth-child(5){color:#58a6ff}.logo span:nth-child(6){color:#a77bf3}.sub{text-align:center;color:#666;font-size:13px;margin-bottom:14px}.mode,.row,.speech{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 5px 14px rgba(0,0,0,.07)}.mode,.speech{display:flex;align-items:center;justify-content:space-between;gap:10px}.mode small{display:block;color:#666;margin-top:3px}.switch{position:relative;width:58px;height:34px;flex:0 0 auto}.switch input{display:none}.slider{position:absolute;inset:0;background:#ccc;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:28px;height:28px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 5px #999}.switch input:checked+.slider{background:#28c76f}.switch input:checked+.slider:before{transform:translateX(24px)}.notice{display:none;background:#fff3f5;border:1px solid #ff9bbd;color:#8a2248;border-radius:14px;padding:10px 12px;margin:-4px 0 12px;font-size:13px}.rowhead{display:flex;justify-content:space-between;margin-bottom:8px;gap:8px}.rowhead b{font-size:15px}.count{font-size:12px;color:#777}.entry{display:flex;gap:8px}input[type=text]{width:100%;border:1.5px solid #ddd;border-radius:14px;padding:12px 13px;font-size:16px}.add,.tool,.close,.gacha,.del{border:none;border-radius:14px;padding:11px 13px;font-size:15px;font-weight:800}.add{background:#f0f2f5;white-space:nowrap}.gacha{width:100%;font-size:25px;padding:16px;margin:4px 0 12px;color:#fff;background:linear-gradient(90deg,#ff5d9e,#ff9f43,#ffd84d,#62d59d,#58a6ff,#a77bf3)}.result{min-height:104px;background:#171717;color:#fff;border-radius:20px;padding:20px 16px;display:flex;align-items:center;gap:10px;overflow:hidden}.ghost{font-size:32px}.resultText{font-size:22px;font-weight:800;white-space:nowrap;opacity:0;filter:blur(8px);transform:translateY(8px)}.resultText.show{animation:ghostin 2s ease forwards}@keyframes ghostin{0%{opacity:0;filter:blur(10px);transform:translateY(8px)}55%{opacity:.55;filter:blur(4px)}100%{opacity:1;filter:blur(0);transform:translateY(0)}}.marquee{display:inline-block;animation:scroll 10s linear infinite}@keyframes scroll{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(-55%)}}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tool{background:#fff;border:1.5px solid #ddd}.speech{margin-top:10px}.footer{text-align:center;margin-top:18px;font-size:14px;color:#555;font-weight:700}.footer em{color:var(--pink);font-style:normal;font-size:17px}.help{font-size:12px;color:#777;text-align:center;margin-top:8px;line-height:1.5}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet{background:#fff;border-radius:22px 22px 14px 14px;width:min(720px,100%);max-height:80vh;overflow:auto;padding:16px}.wordGroup{margin:13px 0}.word{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.del{background:#fff0f3;color:#b92554;padding:6px 10px}.close{width:100%;margin-top:10px;background:#222;color:#fff}
</style></head><body><div class="wrap"><div class="logo"><span>こ</span><span>と</span><span>ば</span><span>ガ</span><span>チ</span><span>ャ</span></div><div class="sub">登録した言葉をRND様が勝手に組み合わせます 🎰</div><div class="mode"><div><strong>📺 放送（実演）モード</strong><small>くだらなさは守る。人は傷つけない。</small></div><label class="switch"><input id="demoMode" type="checkbox" checked><span class="slider"></span></label></div><div id="notice" class="notice"></div><div id="rows"></div><button class="gacha" id="gachaBtn">🎰 ガチャ！</button><div class="result"><div class="ghost">👻</div><div id="resultText" class="resultText">ここに結果が出ます</div></div><div class="speech"><span>🔊 読み上げ</span><label class="switch"><input id="speechToggle" type="checkbox"><span class="slider"></span></label></div><div class="toolbar"><button class="tool" id="saveBtn">💾 記憶</button><button class="tool" id="listBtn">📋 一覧</button></div><div class="help">各項目100個まで保存できます。放送モードは毎回ONで始まります。</div><div class="footer">くだらないのは、あなたの <em>責任</em> です。</div></div><div id="modal" class="modal"><div class="sheet"><h3>登録した言葉</h3><div id="wordList"></div><button class="close" id="closeBtn">閉じる</button></div></div><script>
const defs=[{key:"who",label:"① 〇〇は（誰・何）",ph:"例：チャッピーは"},{key:"place",label:"② 場所",ph:"例：お寺で"},{key:"with",label:"③ 〇〇と（誰・何と）",ph:"例：おじさんと"},{key:"move",label:"④ 動き",ph:"例：踊って"},{key:"end",label:"⑤ どうした・どうなった",ph:"例：逃げた"}];const STORAGE="kotoba-gacha-v5";let words=JSON.parse(localStorage.getItem(STORAGE)||"{}");for(const d of defs)if(!Array.isArray(words[d.key]))words[d.key]=[];
const blocked=[/死ね|しね|殺す|ころす|殺害|ぶっ殺|自殺しろ/i,/レイプ|強姦|輪姦|性器|ちんこ|まんこ|セックス|性交|フェラ|クンニ/i,/障害者.*(死|消え)|キチガイ|気違い/i,/朝鮮人.*(死|消え)|中国人.*(死|消え)|黒人.*(死|消え)|白人.*(死|消え)/i,/首を切|刺し殺|撃ち殺|焼き殺|殴り殺/i];const attackPatterns=[/お前.*(バカ|馬鹿|アホ|死ね|消えろ|クズ)/i,/あいつ.*(バカ|馬鹿|アホ|死ね|消えろ|クズ)/i,/.+さん.*(死ね|消えろ|クズ|ゴミ)/i];
const rows=document.getElementById("rows");function buildRows(){rows.innerHTML="";defs.forEach(d=>{const div=document.createElement("div");div.className="row";div.innerHTML=`<div class="rowhead"><b>${d.label}</b><span class="count" id="c-${d.key}">登録 ${words[d.key].length} / 100</span></div><div class="entry"><input id="i-${d.key}" type="text" maxlength="60" placeholder="${d.ph}"><button class="add" data-key="${d.key}">＋登録</button></div>`;rows.appendChild(div)})}buildRows();function showNotice(msg){const n=document.getElementById("notice");n.textContent=msg;n.style.display="block";clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>n.style.display="none",3500)}function isBlocked(s){if(!document.getElementById("demoMode").checked)return false;return blocked.some(r=>r.test(s))||attackPatterns.some(r=>r.test(s))}function save(){localStorage.setItem(STORAGE,JSON.stringify(words));showNotice("💾 記憶しました")}function addWord(key){const input=document.getElementById("i-"+key),v=input.value.trim();if(!v)return;if(words[key].length>=100){showNotice("この項目は100個までです");return}if(isBlocked(v)){showNotice("📺 実演モードでは、その表現は登録できません");return}if(words[key].includes(v)){showNotice("同じ言葉はすでに登録されています");return}words[key].push(v);input.value="";localStorage.setItem(STORAGE,JSON.stringify(words));document.getElementById("c-"+key).textContent=`登録 ${words[key].length} / 100`}
document.addEventListener("click",e=>{if(e.target.classList.contains("add"))addWord(e.target.dataset.key)});document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input[type=text]"))addWord(e.target.id.replace("i-",""))});document.getElementById("gachaBtn").onclick=()=>{const missing=defs.filter(d=>words[d.key].length===0);if(missing.length){showNotice("5つの項目すべてに、1個以上登録してください");return}const pick=a=>a[Math.floor(Math.random()*a.length)],result=defs.map(d=>pick(words[d.key])).join(" "),el=document.getElementById("resultText");el.classList.remove("show","marquee");void el.offsetWidth;el.textContent=result;el.classList.add("show");setTimeout(()=>{if(el.scrollWidth>el.parentElement.clientWidth-55)el.classList.add("marquee");if(document.getElementById("speechToggle").checked&&"speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(result);u.lang="ja-JP";u.rate=.95;speechSynthesis.speak(u)}},2000)};document.getElementById("saveBtn").onclick=save;document.getElementById("listBtn").onclick=renderList;document.getElementById("closeBtn").onclick=()=>document.getElementById("modal").style.display="none";document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.target.style.display="none"};function renderList(){const box=document.getElementById("wordList");box.innerHTML="";defs.forEach(d=>{const g=document.createElement("div");g.className="wordGroup";const h=document.createElement("b");h.textContent=d.label;g.appendChild(h);if(!words[d.key].length){const p=document.createElement("div");p.textContent="（まだありません）";p.style.color="#888";g.appendChild(p)}else words[d.key].forEach((w,i)=>{const r=document.createElement("div");r.className="word";const s=document.createElement("span");s.textContent=w;const b=document.createElement("button");b.className="del";b.textContent="削除";b.onclick=()=>{words[d.key].splice(i,1);localStorage.setItem(STORAGE,JSON.stringify(words));buildRows();renderList()};r.append(s,b);g.appendChild(r)});box.appendChild(g)});document.getElementById("modal").style.display="flex"}document.getElementById("demoMode").checked=true;document.getElementById("speechToggle").checked=false;
</script></body></html>
